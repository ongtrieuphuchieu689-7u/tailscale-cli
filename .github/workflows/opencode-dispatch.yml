name: OpenCode Dispatch

on:
  workflow_dispatch:
    inputs:
      prompt:
        description: "Prompt to send to OpenCode"
        required: true
        type: string
      model:
        description: "Model to use (provider/model)"
        required: false
        default: "opencode/big-pickle"
        type: string
      branch:
        description: "Branch to run on"
        required: false
        default: "main"
        type: string

jobs:
  dispatch:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: write
      pull-requests: write
      issues: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.branch }}
          persist-credentials: false

      - name: Run OpenCode
        uses: anomalyco/opencode/github@latest
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCLI_TOKEN_OWNER: ${{ env.GHCLI_TOKEN_OWNER }}
        with:
          model: ${{ inputs.model }}
          use_github_token: true
          prompt: ${{ inputs.prompt }}
