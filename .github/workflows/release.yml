name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Cache node_modules
        id: cache-node
        uses: actions/cache@v6
        with:
          path: node_modules
          key: node-cache-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - name: Install dependencies
        if: steps.cache-node.outputs.cache-hit != 'true'
        run: npm ci
      - run: npm run check
      - run: npm run build
      - run: npm publish --provenance --access public

  publish-github-packages:
    runs-on: ubuntu-latest
    needs: publish
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Cache node_modules
        id: cache-node-gh
        uses: actions/cache@v6
        with:
          path: node_modules
          key: node-cache-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - name: Install dependencies
        if: steps.cache-node-gh.outputs.cache-hit != 'true'
        run: npm ci
      - run: npm run build
      - run: node scripts/publish-github.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}