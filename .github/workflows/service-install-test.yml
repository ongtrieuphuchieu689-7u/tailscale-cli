name: Service Install & Daemon Verification Matrix

on:
  workflow_dispatch:
  push:
    paths:
      - "src/service/**"
      - "scripts/ci/**"
      - "docs/service-install-plan.md"
      - "docs/service-install-verification.md"
      - ".github/workflows/service-install-test.yml"

permissions:
  contents: read

jobs:
  test-linux-service:
    name: Linux systemd Service Test (Rootless)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies & Build CLI
        run: |
          npm ci
          npm run check
          npm run build
          npm link

      - name: Test Service Init
        run: |
          mkdir -p /tmp/ts-service-test
          tailsacle-cli service init --name test-relay-service --out /tmp/ts-service-test/service.jsonc
          test -f /tmp/ts-service-test/service.jsonc
          cat /tmp/ts-service-test/service.jsonc

      - name: Start Echo Server
        run: |
          node scripts/ci/service-test-echo-server.mjs --port 19999 &
          sleep 2

      - name: Patch Config
        run: |
          node scripts/ci/service-test-patch-config.mjs \
            --in  /tmp/ts-service-test/service.jsonc \
            --out /tmp/ts-service-test/service.json \
            --listen 18888 \
            --target 127.0.0.1:19999

      - name: Install User Service (systemd rootless)
        run: tailsacle-cli service install --file /tmp/ts-service-test/service.json --user --yes --json

      - name: Check Service Status
        run: |
          tailsacle-cli service status --name test-relay-service --json
          systemctl --user is-active test-relay-service

      - name: Verify TCP Traffic Flow
        run: node scripts/ci/service-test-verify-relay.mjs --port 18888

      - name: Check Service Logs
        run: tailsacle-cli service logs --name test-relay-service --lines 30

      - name: Restart Service
        run: |
          tailsacle-cli service restart --name test-relay-service
          sleep 2
          systemctl --user is-active test-relay-service

      - name: Stop Service
        run: |
          tailsacle-cli service stop --name test-relay-service
          sleep 2
          ! systemctl --user is-active test-relay-service

      - name: Uninstall Service Cleanly
        run: |
          tailsacle-cli service uninstall --name test-relay-service --yes --json
          test ! -f ~/.config/systemd/user/test-relay-service.service

  test-windows-service:
    name: Windows SCM Service Test (WinSW)
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        shell: pwsh
        run: npm ci

      - name: Run unit tests & typecheck
        shell: pwsh
        run: npm run check

      - name: Build CLI
        shell: pwsh
        run: npm run build

      - name: Link CLI
        shell: pwsh
        run: npm link

      - name: Test Service Init
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "C:\tmp\ts-service-test"
          tailsacle-cli service init --name win-relay-svc --out "C:\tmp\ts-service-test\service.jsonc"
          Get-Content "C:\tmp\ts-service-test\service.jsonc"

      - name: Patch Config
        shell: pwsh
        run: |
          node scripts/ci/service-test-patch-config.mjs `
            --in  "C:/tmp/ts-service-test/service.jsonc" `
            --out "C:/tmp/ts-service-test/service.json" `
            --listen 18888 `
            --target "127.0.0.1:19999"

      - name: Install Windows Service (Elevated GitHub Runner)
        shell: pwsh
        run: tailsacle-cli service install --file "C:\tmp\ts-service-test\service.json" --yes --json

      - name: Verify SCM State
        shell: pwsh
        run: |
          tailsacle-cli service status --name win-relay-svc --json
          sc.exe query win-relay-svc

      - name: Check Service Logs
        shell: pwsh
        run: tailsacle-cli service logs --name win-relay-svc --lines 30

      - name: Stop, Start, Restart Cycle
        shell: pwsh
        run: |
          tailsacle-cli service stop --name win-relay-svc
          sc.exe query win-relay-svc
          tailsacle-cli service start --name win-relay-svc
          sc.exe query win-relay-svc

      - name: Clean Uninstall
        shell: pwsh
        run: |
          tailsacle-cli service uninstall --name win-relay-svc --yes --json
          cmd /c 'sc query win-relay-svc >nul 2>&1'
          if ($LASTEXITCODE -eq 0) { throw "SCM service still exists after uninstall" }

  test-windows-scheduler:
    name: Windows Task Scheduler Test (schtasks, no admin)
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        shell: pwsh
        run: npm ci

      - name: Build CLI
        shell: pwsh
        run: npm run build

      - name: Link CLI
        shell: pwsh
        run: npm link

      - name: Init Config
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "C:\tmp\ts-sched-test"
          tailsacle-cli service init --name win-sched-svc --out "C:\tmp\ts-sched-test\service.jsonc"

      - name: Patch Config
        shell: pwsh
        run: |
          node scripts/ci/service-test-patch-config.mjs `
            --in  "C:/tmp/ts-sched-test/service.jsonc" `
            --out "C:/tmp/ts-sched-test/service.json" `
            --listen 18889 `
            --target "127.0.0.1:19999"

      - name: Install via Task Scheduler
        shell: pwsh
        run: |
          tailsacle-cli service install --file "C:\tmp\ts-sched-test\service.json" --scheduler --yes --json
          schtasks.exe /query /tn "tailsacle-cli\win-sched-svc"

      - name: Run & Verify Scheduler Task
        shell: pwsh
        run: |
          tailsacle-cli service start --name win-sched-svc
          Start-Sleep -Seconds 3
          schtasks.exe /query /tn "tailsacle-cli\win-sched-svc" /v /fo list
          tailsacle-cli service status --name win-sched-svc --json

      - name: Stop & Uninstall Scheduler Task
        shell: pwsh
        run: |
          tailsacle-cli service stop --name win-sched-svc
          tailsacle-cli service uninstall --name win-sched-svc --yes --json
          cmd /c 'schtasks /query /tn "tailsacle-cli\win-sched-svc" >nul 2>&1'
          if ($LASTEXITCODE -eq 0) { throw "scheduler task still exists" }
