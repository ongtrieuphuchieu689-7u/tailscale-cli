name: Issue Triage

on:
  issues:
    types: [opened]

jobs:
  triage:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: write
      pull-requests: write
      issues: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - uses: anomalyco/opencode/github@latest
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCLI_TOKEN_OWNER: ${{ secrets.GHCLI_TOKEN_OWNER }}
        with:
          model: opencode/big-pickle
          token: ${{ secrets.GHCLI_TOKEN_OWNER }}
          use_github_token: true
          prompt: |
            Review this issue. If there's a clear fix:
            - Create a new branch named "fix/issue-{number}"
            - Make the necessary code changes
            - Commit the changes
            - Open a pull request with the fix
            Otherwise, just comment with documentation links.
