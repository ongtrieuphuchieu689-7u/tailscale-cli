name: Auto-tag on merge

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  tag:
    if: "!startsWith(github.event.head_commit.message, 'chore(release):')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Bump version
        id: bump
        run: |
          BEFORE=$(node -p "require('./package.json').version")
          if node scripts/bump-version.mjs; then
            AFTER=$(node -p "require('./package.json').version")
            echo "before=$BEFORE" >> "$GITHUB_OUTPUT"
            echo "after=$AFTER" >> "$GITHUB_OUTPUT"
          else
            echo "before=$BEFORE" >> "$GITHUB_OUTPUT"
            echo "after=$BEFORE" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit and tag release
        if: steps.bump.outputs.before != steps.bump.outputs.after
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ steps.bump.outputs.after }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json
          git commit -m "chore(release): v${VERSION}"
          git tag "v${VERSION}"
          git push origin main
          git push origin "v${VERSION}"
