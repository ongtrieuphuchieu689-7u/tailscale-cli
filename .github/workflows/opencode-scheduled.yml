name: Scheduled OpenCode Task

on:
  schedule:
    - cron: "0 9 * * 1" # Every Monday at 9am UTC

jobs:
  opencode:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: write
      pull-requests: write
      issues: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Run OpenCode
        uses: anomalyco/opencode/github@latest
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GHCLI_TOKEN_OWNER }}
        with:
          model: opencode/big-pickle
          use_github_token: true
          prompt: |
            Review the codebase for TODO comments and issues.
            If you find problems worth fixing:
            - Create a new branch named "fix/auto-{description}"
            - Make the code changes
            - Commit with descriptive message
            - Open a pull request
            If no issues found, just open an issue with a summary.
