# Azure DevOps pipeline — Tailscale funnel + OpenCode serve on Windows
# Mirrors .github/workflows/test-funnel-windows.yml. Manual runs only.
# tailsacle-cli downloads and installs the official Windows MSI itself on first use.

parameters:
  - name: keepalive_minutes
    displayName: Minutes to keep the funnel tunnel alive (job max is 360)
    type: number
    default: 120

trigger: none
pr: none

variables:
  - group: tailsacle-cli

pool:
  vmImage: windows-latest

jobs:
  - job: funnel_test_windows
    displayName: Tailscale funnel (Windows)
    timeoutInMinutes: 360
    steps:
      - checkout: self
        clean: true

      - task: NodeTool@0
        displayName: Install Node 24 (latest)
        inputs:
          versionSpec: 24.x

      - task: Cache@2
        displayName: Cache npm (Azure)
        inputs:
          key: '"npm" | "$(Agent.OS)" | "$(Build.SourcesDirectory)/package-lock.json"'
          path: '$(LOCALAPPDATA)\npm-cache'
          cacheHitVar: NPM_CACHE_RESTORED

      - bash: |
          set -euo pipefail
          npm install -g opencode-ai@latest tailsacle-cli@latest
          echo "node $(node -v) npm $(npm -v)"
          tailsacle-cli --version
          opencode --version || true
          which opencode tailsacle-cli
          which tailscale 2>/dev/null || echo "tailscale not on PATH yet (MSI installed by the CLI on first use)"
        displayName: Install newest opencode-ai and tailsacle-cli from npmjs

      - bash: |
          set -euo pipefail
          OUT="$(tailsacle-cli doctor --detect-credentials --json)"
          echo "$OUT"
          echo "$OUT" | node -e "let d='';process.stdin.on('data',c=>d+=c).on('end',()=>{const c=JSON.parse(d).resolved.credential;if(!c||!c.found){console.error('CREDENTIAL_NOT_AUTO_DETECTED');process.exit(1)}console.log('auto-detected source:',c.source,'masked:',c.masked)})"
          echo "api credential hint: $(echo "$OUT" | node -e "let d='';process.stdin.on('data',c=>d+=c).on('end',()=>console.log(JSON.parse(d).resolved.apiCredential))")"
        displayName: CLI must auto-detect the trust credential from the environment
        env:
          TS_CLIENT_SECRET: $(TS_CLIENT_SECRET)
          TS_TAILNET: $(TS_TAILNET)
          TS_HOSTNAME: opencode-azure-win
          TS_TAGS: $(TS_TAGS)
          TS_EPHEMERAL: $(TS_EPHEMERAL)

      - bash: |
          set -euo pipefail
          tailsacle-cli cleanup --yes --json
        displayName: Prune stale offline test node from a previous run
        env:
          TS_CLIENT_SECRET: $(TS_CLIENT_SECRET)
          TS_TAILNET: $(TS_TAILNET)
          TS_HOSTNAME: opencode-azure-win
          TS_TAGS: $(TS_TAGS)
          TS_EPHEMERAL: $(TS_EPHEMERAL)
          TS_CLEANUP_OFFLINE_AFTER: "1"

      - bash: |
          set -euo pipefail
          tailsacle-cli dns --json
          OUT="$(tailsacle-cli deploy --yes --apply-policy --enable-https --cleanup --json)"
          echo "$OUT"
          BASE="$(echo "$OUT" | node -e "let d='';process.stdin.on('data',c=>d+=c).on('end',()=>{const j=JSON.parse(d);const dev=j.resolved&&j.resolved.device;const dns=dev&&dev.dnsName&&dev.dnsName.replace(/\.\s*$/,'');if(!dns){console.error('NO_DNS_NAME');process.exit(1)}console.log('https://'+dns+'/')})")"
          echo "##vso[task.setvariable variable=FUNNEL_BASE]$BASE"
          echo "funnel_base=$BASE"
        displayName: Verify API auto-auth and join the tailnet (installs MSI + service)
        env:
          TS_CLIENT_SECRET: $(TS_CLIENT_SECRET)
          TS_TAILNET: $(TS_TAILNET)
          TS_HOSTNAME: opencode-azure-win
          TS_TAGS: $(TS_TAGS)
          TS_EPHEMERAL: $(TS_EPHEMERAL)

      - powershell: |
          @'
          {
            "$schema": "https://opencode.ai/config.json",
            "theme": { "mode": "dark" }
          }
          '@ | Set-Content -Encoding utf8 opencode.json
          $pass = node -e "console.log(require('node:crypto').randomBytes(8).toString('hex'))"
          Set-Content -NoNewline -Encoding ascii serve-pass.txt $pass
          @"
          @echo off
          set OPENCODE_SERVE_PASS=$pass
          opencode serve --port 4096 >> "%~dp0opencode-serve.log" 2>&1
          "@ | Set-Content -Encoding ascii serve.cmd
          Write-Host "opencode workspace: $(Get-Location)"
          # WMI-spawned processes are not children of the step shell, so the
          # runner's step cleanup cannot kill them (Start-Process children die
          # at step boundaries on Windows).
          $null = Invoke-CimMethod -ClassName Win32_Process -MethodName Create -Arguments @{
            CommandLine = "cmd.exe /d /c `"$(Join-Path (Get-Location) 'serve.cmd')`""
            CurrentDirectory = (Get-Location).Path
          }
          $ready = $false
          for ($i = 0; $i -lt 90; $i++) {
            try { Invoke-WebRequest -Uri 'http://127.0.0.1:4096/' -UseBasicParsing -TimeoutSec 5 | Out-Null; $ready = $true; break } catch { Start-Sleep -Seconds 2 }
          }
          if (-not $ready) {
            Write-Host "serve failed to start"
            if (Test-Path opencode-serve.log) { Get-Content opencode-serve.log -Tail 40 }
            exit 1
          }
          Write-Host "opencode serve ready on :4096"
        displayName: Configure opencode for the workspace and start opencode serve

      - bash: |
          set -euo pipefail
          tailsacle-cli funnel http://127.0.0.1:4096 --https 443 --yes --apply-policy --enable-https --verify-timeout 180 --json
          echo
          echo "==================== ACCESS ===================="
          echo "OpenCode UI : $FUNNEL_BASE"
          echo "Serve pass  : $(cat serve-pass.txt)"
          echo "CLI version : $(tailsacle-cli --version)"
          echo "Node name   : opencode-azure-win"
          echo "==============================================="
          {
            echo "OpenCode funnel (Azure Windows run)"
            echo ""
            echo "$FUNNEL_BASE"
            echo ""
            echo "serve pass: $(cat serve-pass.txt)"
            echo "build: $SYSTEM_COLLECTIONURI$SYSTEM_TEAMPROJECT/_build/results?buildId=$BUILD_BUILDID"
          } > "$(Build.ArtifactStagingDirectory)/opencode-access.txt"
          cat "$(Build.ArtifactStagingDirectory)/opencode-access.txt"
        displayName: Publish Funnel tunnel and print access info
        env:
          TS_CLIENT_SECRET: $(TS_CLIENT_SECRET)
          TS_TAILNET: $(TS_TAILNET)
          TS_HOSTNAME: opencode-azure-win
          TS_TAGS: $(TS_TAGS)
          TS_EPHEMERAL: $(TS_EPHEMERAL)

      - publish: $(Build.ArtifactStagingDirectory)/opencode-access.txt
        artifact: opencode-access
        displayName: Publish OpenCode access info artifact

      - powershell: |
          $keep = ((${{ parameters.keepalive_minutes }} * 60) - 60)
          if ($keep -lt 60) { $keep = 60 }
          $deadline = (Get-Date).AddSeconds($keep)
          $last = 0
          $launcher = Join-Path (Get-Location) 'serve.cmd'
          function Start-Serve {
            Get-NetTCPConnection -LocalPort 4096 -State Listen -ErrorAction SilentlyContinue |
              ForEach-Object { Stop-Process -Id $_.OwningProcess -Force -ErrorAction SilentlyContinue }
            Start-Sleep -Seconds 1
            $null = Invoke-CimMethod -ClassName Win32_Process -MethodName Create -Arguments @{
              CommandLine = "cmd.exe /d /c `"$launcher`""
              CurrentDirectory = (Get-Location).Path
            }
          }
          Write-Host "keeping alive until $($deadline.ToString('o'))"
          $up = $false
          try { Invoke-WebRequest -Uri 'http://127.0.0.1:4096/' -UseBasicParsing -TimeoutSec 10 | Out-Null; $up = $true } catch { }
          if (-not $up) {
            Write-Host "[keepalive] serve down, restarting $(Get-Date -Format o)"
            Start-Serve
          }
          while ((Get-Date) -lt $deadline) {
            $ok = $true
            try { Invoke-WebRequest -Uri 'http://127.0.0.1:4096/' -UseBasicParsing -TimeoutSec 10 | Out-Null } catch { $ok = $false }
            if (-not $ok) {
              Write-Host "[keepalive] serve down, restarting $(Get-Date -Format o)"
              Start-Serve
            }
            $markers = [int]((Get-Date -UFormat %s) / 600)
            if ($markers -gt $last) {
              Write-Host "[keepalive] heartbeat $(Get-Date -Format o) tunnel $env:FUNNEL_BASE"
              $last = $markers
            }
            Start-Sleep -Seconds 60
          }
          Write-Host "keepalive finished; tunnel closes when the job ends"
          if (Test-Path 'C:\Program Files\Tailscale\tailscale.exe') {
            & 'C:\Program Files\Tailscale\tailscale.exe' funnel off 2>$null
          }
        displayName: Keepalive (supervise serve, hold the tunnel open)
        timeoutInMinutes: ${{ parameters.keepalive_minutes }}