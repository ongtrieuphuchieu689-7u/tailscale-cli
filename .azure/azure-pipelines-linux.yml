# Azure DevOps pipeline — Tailscale funnel + OpenCode serve on Linux
# Mirrors .github/workflows/test-funnel.yml. Manual runs only.
# Variable group "tailsacle-cli" supplies TS_CLIENT_SECRET / TS_TAILNET / TS_TAGS / TS_EPHEMERAL.

parameters:
  - name: keepalive_minutes
    displayName: Minutes to keep the funnel tunnel alive (job max is 360)
    type: number
    default: 120

trigger: none
pr: none

variables:
  - group: tailsacle-cli

pool:
  vmImage: ubuntu-latest

jobs:
  - job: funnel_test_linux
    displayName: Tailscale funnel (Linux)
    timeoutInMinutes: 360
    steps:
      - checkout: self
        clean: true

      - task: UseNode@1
        inputs:
          version: '24.x'   # thay 'versionSpec' bằng 'version'


      - task: Cache@2
        displayName: Cache npm (Azure)
        inputs:
          key: '"npm" | "$(Agent.OS)" | "$(Build.SourcesDirectory)/package-lock.json"'
          path: $(HOME)/.npm
          cacheHitVar: NPM_CACHE_RESTORED

      - bash: |
          set -euo pipefail
          npm install -g opencode-ai@latest tailsacle-cli@latest
          echo "node $(node -v) npm $(npm -v)"
          tailsacle-cli --version
          opencode --version || true
          which tailscale opencode tailsacle-cli 2>/dev/null || true
        displayName: Install newest opencode-ai and tailsacle-cli from npmjs
        # No tailscale install step: tailsacle-cli downloads the official static
        # tailscale/tailscaled binaries itself and starts a userspace tailscaled
        # from its binary cache when no system daemon is running.

      - bash: |
          set -euo pipefail
          OUT="$(tailsacle-cli doctor --detect-credentials --json)"
          echo "$OUT"
          echo "$OUT" | node -e "let d='';process.stdin.on('data',c=>d+=c).on('end',()=>{const c=JSON.parse(d).resolved.credential;if(!c||!c.found){console.error('CREDENTIAL_NOT_AUTO_DETECTED');process.exit(1)}console.log('auto-detected source:',c.source,'masked:',c.masked)})"
          echo "api credential hint: $(echo "$OUT" | node -e "let d='';process.stdin.on('data',c=>d+=c).on('end',()=>console.log(JSON.parse(d).resolved.apiCredential))")"
        displayName: CLI must auto-detect the trust credential from the environment
        env:
          TS_CLIENT_SECRET: $(TS_CLIENT_SECRET)
          TS_TAILNET: $(TS_TAILNET)
          TS_HOSTNAME: opencode-azure
          TS_TAGS: $(TS_TAGS)
          TS_EPHEMERAL: $(TS_EPHEMERAL)

      - bash: |
          set -euo pipefail
          tailsacle-cli cleanup --yes --json
        displayName: Prune stale offline test node from a previous run
        env:
          TS_CLIENT_SECRET: $(TS_CLIENT_SECRET)
          TS_TAILNET: $(TS_TAILNET)
          TS_HOSTNAME: opencode-azure
          TS_TAGS: $(TS_TAGS)
          TS_EPHEMERAL: $(TS_EPHEMERAL)
          TS_CLEANUP_OFFLINE_AFTER: "1"

      - bash: |
          set -euo pipefail
          tailsacle-cli dns --json
          OUT="$(tailsacle-cli deploy --yes --apply-policy --enable-https --cleanup --json)"
          echo "$OUT"
          BASE="$(echo "$OUT" | node -e "let d='';process.stdin.on('data',c=>d+=c).on('end',()=>{const j=JSON.parse(d);const dev=j.resolved&&j.resolved.device;const dns=dev&&dev.dnsName&&dev.dnsName.replace(/\.\s*$/,'');if(!dns){console.error('NO_DNS_NAME');process.exit(1)}console.log('https://'+dns+'/')})")"
          echo "##vso[task.setvariable variable=FUNNEL_BASE]$BASE"
          echo "funnel_base=$BASE"
        displayName: Verify API auto-auth and join the tailnet
        env:
          TS_CLIENT_SECRET: $(TS_CLIENT_SECRET)
          TS_TAILNET: $(TS_TAILNET)
          TS_HOSTNAME: opencode-azure
          TS_TAGS: $(TS_TAGS)
          TS_EPHEMERAL: $(TS_EPHEMERAL)

      - bash: |
          set -euo pipefail
          cat > opencode.json <<'JSON'
          {
            "$schema": "https://opencode.ai/config.json",
            "theme": { "mode": "dark" }
          }
          JSON
          export OPENCODE_SERVE_PASS="$(openssl rand -hex 8)"
          umask 077
          echo -n "$OPENCODE_SERVE_PASS" > serve-pass.txt
          echo "opencode workspace: $(pwd) ($(git rev-parse --short HEAD 2>/dev/null || echo no-git))"
          nohup setsid env OPENCODE_SERVE_PASS="$OPENCODE_SERVE_PASS" opencode serve --port 4096 > opencode-serve.log 2>&1 &
          for i in $(seq 1 90); do
            if curl -fsS http://127.0.0.1:4096/ >/dev/null 2>&1; then echo "opencode serve ready on :4096"; break; fi
            sleep 2
          done
          curl -fsI http://127.0.0.1:4096/ >/dev/null || { echo "serve failed to start"; tail -40 opencode-serve.log; exit 1; }
        displayName: Configure opencode for the workspace and start opencode serve

      - bash: |
          set -euo pipefail
          tailsacle-cli funnel http://127.0.0.1:4096 --https 443 --yes --apply-policy --enable-https --verify-timeout 180 --json
          echo
          echo "==================== ACCESS ===================="
          echo "OpenCode UI : $FUNNEL_BASE"
          echo "Serve pass  : $(cat serve-pass.txt)"
          echo "CLI version : $(tailsacle-cli --version)"
          echo "Node name   : opencode-azure"
          echo "==============================================="
          {
            echo "OpenCode funnel (Azure Linux run)"
            echo ""
            echo "$FUNNEL_BASE"
            echo ""
            echo "serve pass: $(cat serve-pass.txt)"
            echo "build: $SYSTEM_COLLECTIONURI$SYSTEM_TEAMPROJECT/_build/results?buildId=$BUILD_BUILDID"
          } > "$(Build.ArtifactStagingDirectory)/opencode-access.txt"
          cat "$(Build.ArtifactStagingDirectory)/opencode-access.txt"
        displayName: Publish Funnel tunnel and print access info
        env:
          TS_CLIENT_SECRET: $(TS_CLIENT_SECRET)
          TS_TAILNET: $(TS_TAILNET)
          TS_HOSTNAME: opencode-azure
          TS_TAGS: $(TS_TAGS)
          TS_EPHEMERAL: $(TS_EPHEMERAL)

      - publish: $(Build.ArtifactStagingDirectory)/opencode-access.txt
        artifact: opencode-access
        displayName: Publish OpenCode access info artifact

      - bash: |
          set -euo pipefail
          keep=$(( ${{ parameters.keepalive_minutes }} * 60 - 60 ))
          [ "$keep" -lt 60 ] && keep=60
          deadline=$(( $(date +%s) + keep ))
          echo "keeping alive until $(date -u -d @$deadline +%FT%TZ)"
          while [ "$(date +%s)" -lt "$deadline" ]; do
            if ! curl -fsS http://127.0.0.1:4096/ >/dev/null 2>&1; then
              echo "[keepalive] serve down, restarting ($(date -u +%FT%TZ))"
              nohup setsid env OPENCODE_SERVE_PASS="$(cat serve-pass.txt)" opencode serve --port 4096 >> opencode-serve.log 2>&1 &
              disown
            fi
            markers=$(( $(date +%s) / 600 ))
            [ "$markers" -gt "${last:-0}" ] && { echo "[keepalive] heartbeat $(date -u +%FT%TZ) tunnel $FUNNEL_BASE"; last="$markers"; }
            sleep 60
          done
          echo "keepalive finished; tunnel closes when the job ends"
          TS_BIN="$HOME/.cache/tailsacle-cli/bin/tailscale"
          [ -x "$TS_BIN" ] && "$TS_BIN" funnel off 2>/dev/null || true
        displayName: Keepalive (supervise serve, hold the tunnel open)
        timeoutInMinutes: ${{ parameters.keepalive_minutes }}