# Azure DevOps pipeline — Service install & daemon verification
# Mirrors .github/workflows/service-install-test.yml exactly.
# Inline scripts replaced by scripts/ci/*.mjs — edit there, not here.
#
# Covers:
#   - Linux systemd rootless service (user unit, relay echo verified)
#   - Windows SCM service (WinSW driven directly)
#   - Windows Task Scheduler service (schtasks, no admin)

trigger: none
pr: none

stages:
  - stage: linux
    displayName: Linux systemd Service Test
    dependsOn: []
    pool:
      vmImage: ubuntu-latest
    jobs:
      - job: linux_systemd
        displayName: Rootless systemd service
        timeoutInMinutes: 30
        steps:
          - checkout: self
            clean: true

          - task: UseNode@1
            displayName: Install Node 22
            inputs:
              version: '22.x'

          - script: |
              npm ci
              npm run check
              npm run build
            displayName: Install deps, typecheck, tests, build

          - bash: |
              set -euo pipefail
              mkdir -p /tmp/ts-service-test
              node dist/cli.js service init --name test-relay-service --out /tmp/ts-service-test/service.jsonc
              test -f /tmp/ts-service-test/service.jsonc
              cat /tmp/ts-service-test/service.jsonc
            displayName: Test Service Init

          - bash: |
              set -euo pipefail
              node scripts/ci/service-test-echo-server.mjs --port 19999 &
              sleep 2
            displayName: Start Echo Server

          - bash: |
              set -euo pipefail
              node scripts/ci/service-test-patch-config.mjs \
                --in  /tmp/ts-service-test/service.jsonc \
                --out /tmp/ts-service-test/service.json \
                --listen 18888 \
                --target 127.0.0.1:19999
            displayName: Patch Config

          - bash: |
              set -euo pipefail
              node dist/cli.js service install --file /tmp/ts-service-test/service.json --user --yes --json
              node dist/cli.js service status --name test-relay-service --json
              systemctl --user is-active test-relay-service
            displayName: Install User Service + status

          - bash: |
              set -euo pipefail
              node scripts/ci/service-test-verify-relay.mjs --port 18888
            displayName: Verify TCP traffic through relay

          - bash: |
              set -euo pipefail
              node dist/cli.js service logs --name test-relay-service --lines 30
              node dist/cli.js service restart --name test-relay-service
              sleep 2
              systemctl --user is-active test-relay-service
              node dist/cli.js service stop --name test-relay-service
              sleep 2
              if systemctl --user is-active test-relay-service; then echo "still active after stop"; exit 1; fi
              node dist/cli.js service uninstall --name test-relay-service --yes --json
              test ! -f ~/.config/systemd/user/test-relay-service.service
            displayName: Logs, restart, stop, uninstall

  - stage: windows
    displayName: Windows Service Tests
    dependsOn: []
    pool:
      vmImage: windows-latest
    jobs:
      - job: win_scm
        displayName: Windows SCM Service (WinSW)
        timeoutInMinutes: 30
        steps:
          - checkout: self
            clean: true

          - task: UseNode@1
            displayName: Install Node 22
            inputs:
              version: '22.x'

          - pwsh: npm ci
            displayName: Install dependencies

          - pwsh: npm run check
            displayName: Typecheck + unit tests

          - pwsh: npm run build
            displayName: Build CLI

          - powershell: |
              New-Item -ItemType Directory -Force -Path "C:\tmp\ts-service-test"
              node dist/cli.js service init --name win-relay-svc --out "C:\tmp\ts-service-test\service.jsonc"
            displayName: Test Service Init

          - powershell: |
              node scripts/ci/service-test-patch-config.mjs `
                --in  "C:/tmp/ts-service-test/service.jsonc" `
                --out "C:/tmp/ts-service-test/service.json" `
                --listen 18888 `
                --target "127.0.0.1:19999"
            displayName: Patch Config

          - powershell: |
              node dist/cli.js service install --file "C:\tmp\ts-service-test\service.json" --yes --json
              node dist/cli.js service status --name win-relay-svc --json
              sc.exe query win-relay-svc
            displayName: Install + verify SCM state

          - powershell: |
              node dist/cli.js service logs --name win-relay-svc --lines 30
              node dist/cli.js service stop --name win-relay-svc
              sc.exe query win-relay-svc
              node dist/cli.js service start --name win-relay-svc
              sc.exe query win-relay-svc
            displayName: Logs + stop/start cycle

          - powershell: |
              node dist/cli.js service uninstall --name win-relay-svc --yes --json
              cmd /c 'sc query win-relay-svc >nul 2>&1'
              if ($LASTEXITCODE -eq 0) { throw "SCM service still exists after uninstall" }
            displayName: Clean uninstall

      - job: win_scheduler
        displayName: Windows Task Scheduler (schtasks)
        timeoutInMinutes: 30
        steps:
          - checkout: self
            clean: true

          - task: UseNode@1
            displayName: Install Node 22
            inputs:
              version: '22.x'

          - pwsh: npm ci
            displayName: Install dependencies

          - pwsh: npm run build
            displayName: Build CLI

          - powershell: |
              New-Item -ItemType Directory -Force -Path "C:\tmp\ts-sched-test"
              node dist/cli.js service init --name win-sched-svc --out "C:\tmp\ts-sched-test\service.jsonc"
            displayName: Init Config

          - powershell: |
              node scripts/ci/service-test-patch-config.mjs `
                --in  "C:/tmp/ts-sched-test/service.jsonc" `
                --out "C:/tmp/ts-sched-test/service.json" `
                --listen 18889 `
                --target "127.0.0.1:19999"
            displayName: Patch Config

          - powershell: |
              node dist/cli.js service install --file "C:\tmp\ts-sched-test\service.json" --scheduler --yes --json
              schtasks.exe /query /tn "tailsacle-cli\win-sched-svc"
            displayName: Install via Task Scheduler

          - powershell: |
              node dist/cli.js service start --name win-sched-svc
              Start-Sleep -Seconds 3
              node dist/cli.js service status --name win-sched-svc --json
              schtasks.exe /query /tn "tailsacle-cli\win-sched-svc" /v /fo list
            displayName: Run + verify scheduler task

          - powershell: |
              node dist/cli.js service stop --name win-sched-svc
              node dist/cli.js service uninstall --name win-sched-svc --yes --json
              cmd /c 'schtasks /query /tn "tailsacle-cli\win-sched-svc" >nul 2>&1'
              if ($LASTEXITCODE -eq 0) { throw "scheduler task still exists" }
            displayName: Stop + uninstall scheduler task
